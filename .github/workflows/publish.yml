name: Publish

on:
  # PRIMARY PATH. Run this from the Actions tab; CI does the version bump, the
  # commit, the tag and the publish. Nothing is released from a laptop, and the
  # released artifact is always one a green runner built.
  workflow_dispatch:
    inputs:
      release:
        description: 'patch | minor | major | explicit version (0.2.0) | none (publish package.json as-is)'
        required: true
        default: 'patch'
      dist_tag:
        description: 'npm dist-tag (latest, next, preview)'
        required: false
        default: 'latest'
      dry_run:
        description: 'Run every gate but publish nothing. Does NOT validate npm auth.'
        type: boolean
        default: false

  # Kept for anyone who still prefers tagging. Same gates, no bump — the tag is
  # the source of truth and must already match package.json.
  push:
    tags: ['v*']

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `write` because the dispatch path commits the version bump and pushes
      # the tag. The tag-push path only reads, but permissions are per-job.
      contents: write
      # Load-bearing twice over: it is what lets the runner mint the OIDC token
      # that AUTHENTICATES this publish (npm trusted publishing — there is no
      # NPM_TOKEN anywhere in this repo), and what `--provenance` needs to sign
      # the result. Remove it and the publish fails with ENEEDAUTH.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to detect an already-released version, and the
          # default shallow clone omits them.
          fetch-depth: 0

      # Must precede setup-node — see the same step in ci.yml for why.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          registry-url: https://registry.npmjs.org

      - name: Install
        run: yarn install --immutable

      # ── Resolve the version BEFORE the gates, so a bad input fails fast ──
      #
      # `npm version --no-git-tag-version` only rewrites package.json; the
      # commit and tag are made explicitly below, after the publish succeeds.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "mode=tag" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.release }}" = "none" ]; then
            echo "mode=asis" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          else
            npm version "${{ inputs.release }}" --no-git-tag-version >/dev/null
            echo "mode=bump" >> "$GITHUB_OUTPUT"
            echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      # ModuleInfo.version is a literal that `mercato module add` reads by
      # parsing the file as text, so it cannot derive itself from package.json
      # and silently drifts. Sync it here; ci.yml asserts the two match.
      - name: Sync module metadata version
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs')
            const f = 'src/modules/search_cloudflare/index.ts'
            const want = '${{ steps.version.outputs.version }}'
            const before = fs.readFileSync(f, 'utf8')
            const after = before.replace(/version: '[^']*'/, \"version: '\" + want + \"'\")
            if (after !== before) { fs.writeFileSync(f, after); console.log('synced to ' + want) }
          "

      # The tag is the source of truth on the tag-push path. A mismatch produces
      # a release whose git history cannot be located from npm.
      - name: Verify tag matches package version
        if: steps.version.outputs.mode == 'tag'
        run: |
          set -euo pipefail
          pkg_version=$(node -p "require('./package.json').version")
          if [ "${{ steps.version.outputs.version }}" != "$pkg_version" ]; then
            echo "::error::tag v${{ steps.version.outputs.version }} does not match package.json $pkg_version"
            exit 1
          fi

      # Releasing a version whose tag already exists means one of them is a lie
      # about what shipped. --tolerate-republish would happily hide it.
      - name: Refuse to reuse an existing tag
        if: steps.version.outputs.mode == 'bump'
        run: |
          set -euo pipefail
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::tag v${{ steps.version.outputs.version }} already exists"
            exit 1
          fi

      # Same gates CI runs. A release must never ship something that would have
      # failed on a branch.
      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Summary
        run: |
          {
            echo "### ${{ steps.version.outputs.version }}"
            echo ""
            echo "- mode: \`${{ steps.version.outputs.mode }}\`"
            echo "- dist-tag: \`${{ inputs.dist_tag || 'latest' }}\`"
            echo "- dry run: \`${{ inputs.dry_run || false }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Authentication: npm trusted publishing (OIDC). No token. ──
      #
      # There is deliberately NO `env:` block here. The registry trusts this
      # exact repo + workflow filename (`publish.yml`), so Yarn exchanges the
      # runner's short-lived OIDC token for a single-use publish credential.
      # Nothing long-lived exists to rotate, leak, or expire.
      #
      # Do NOT reintroduce NODE_AUTH_TOKEN / YARN_NPM_AUTH_TOKEN "just in case":
      # when a token is present the CLI takes the legacy auth path INSTEAD of
      # OIDC, which silently costs the trusted-publishing guarantee while still
      # appearing to work.
      #
      # Three things must stay true or auth breaks:
      #   - this file stays named publish.yml (the trust config pins the
      #     filename, not the path)
      #   - `npm publish` stays in THIS workflow, not a reusable/called one —
      #     npm validates the calling workflow's identity
      #   - the runner stays GitHub-hosted; self-hosted is not supported
      # Yarn gained OIDC support in 4.10 (yarnpkg/berry#6898) with the scoped-
      # package fix in #6911; this repo pins yarn 4.12.0.
      #
      # --access public is explicit even though package.json sets
      # publishConfig.access: Yarn documents that scoped packages default to
      # `restricted` "for legacy reasons", and that would fail HERE, after every
      # other gate has passed.
      #
      # --tolerate-republish makes re-running a tag a no-op instead of an error.
      # It also covers the bootstrap: the registry requires a package to EXIST
      # before a trusted publisher can be attached, so the very first version
      # has to be published once from a laptop. Only after that can this
      # workflow authenticate via OIDC.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          yarn npm publish \
            --access public \
            --tag "${{ inputs.dist_tag || 'latest' }}" \
            --tolerate-republish \
            --provenance

      # Dry run stops short of the registry. It proves the gates and the tarball
      # shape, NOT that OIDC auth works — only a real publish proves that.
      - name: Dry run — pack instead of publish
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          yarn pack --out /tmp/package.tgz
          tar -tzf /tmp/package.tgz | sed 's/^/  /'
          echo "dry run: nothing was published"

      # Only after a successful publish. A failure above leaves the repository
      # untouched, so a retry starts from a clean state rather than tripping the
      # existing-tag guard.
      - name: Commit and tag the release
        if: ${{ steps.version.outputs.mode != 'tag' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `bump` rewrote files that must be committed. `asis` published exactly
          # what is already on the branch, so there is nothing to commit — but it
          # still needs a tag, or a released version has no locatable history.
          if [ "${{ steps.version.outputs.mode }}" = "bump" ]; then
            git add package.json src/modules/search_cloudflare/index.ts
            git commit -m "release: v$version"
          fi

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "tag v$version already exists — leaving it alone"
          else
            git tag "v$version"
            # Push the tag first: if the branch push races with another commit,
            # the tag still points at exactly what was published.
            git push origin "v$version"
          fi

          if [ "${{ steps.version.outputs.mode }}" = "bump" ]; then
            git push origin "HEAD:${{ github.ref_name }}"
          fi
